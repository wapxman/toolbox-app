name: toolbox_app
description: Taketool — аренда электроинструментов из умных боксов
publish_to: 'none'
version: 1.1.4+13

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  yandex_mapkit: ^4.1.0
  mobile_scanner: ^7.4.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  url_launcher: ^6.2.2
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
